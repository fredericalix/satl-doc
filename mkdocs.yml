# mkdocs.yml -- the SatL documentation site.
#
# Build it with `make build` (which adds --strict), preview with `make serve`.
#
# `strict` is false HERE and true THERE on purpose: `mkdocs serve` reloads on
# every keystroke, and a strict serve dies the moment you type half a link.
# The Makefile passes --strict to `build`, so the failure lands where it is
# useful -- at the point of publishing -- and never while writing.

site_name: SatL
site_description: >-
  SatL -- a cluster-first container engine for FreeBSD. OCI containers as jails,
  with swarm-style orchestration built in.
site_author: SatL
copyright: >-
  Documentation licensed under
  <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>.

site_url: https://satl.cc/
repo_url: https://github.com/fredericalix/satl-doc
repo_name: fredericalix/satl-doc
# `edit_uri` points at the docs repository, not at SatL: a reader fixing a
# sentence edits the page. The generated pages under reference/cli/ say in their
# own banner that they are the wrong place to edit -- see overlay/cli.yml.
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site
strict: false

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.tooltips
  palette:
    # The system-preference entry carries the colours too, even though it
    # delegates light/dark to the two below: its attributes are what the server
    # renders into the HTML, so without them the first paint is Material's
    # default indigo until palette.js resolves the real one.
    - media: "(prefers-color-scheme)"
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-auto
        name: Follow the system theme
    # `custom` on purpose: it suppresses Material's own colour rules so
    # stylesheets/extra.css owns the pastel-orange palette, including the
    # contrast fixes a pastel primary needs. Do not put a colour name back here
    # without deleting that block.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/git-alt

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      # The default separator splits on whitespace and hyphens only, which
      # leaves `--update-parallelism` indexed as one token: typing
      # "parallelism" finds nothing. Splitting on `-`, `_`, `.` and `/` as
      # well makes every part of a flag name searchable, which is how anyone
      # actually looks for one.
      separator: '[\s\-\._/]+'
  - git-revision-date-localized:
      # The generated pages carry no timestamp by design -- a timestamp in the
      # file would churn every diff and make `make check-gen` useless. This
      # plugin puts the date back where it belongs: read from git at build
      # time, so it cannot claim a page is fresher than its last commit.
      #
      # GIT_DATES is set to false by the Makefile while the repository has no
      # commits yet. In that state the plugin warns once per page ("Unable to
      # read git logs"), and `build --strict` turns those warnings into a
      # failure -- so a brand-new checkout could not build at all. The variable
      # defaults to true: the moment there is a commit, dates come back with no
      # configuration change.
      enabled: !ENV [GIT_DATES, true]
      enable_creation_date: true
      fallback_to_build_date: true
      type: date

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      permalink_title: Link to this section
  - pymdownx.details
  # custom_fences is what makes a ```mermaid block render as a diagram rather
  # than as literal text. Without this stanza superfences still loads and
  # nothing warns -- the block just renders as a code listing, which is a
  # failure you only find by looking at the built page.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: [docs/snippets]
      check_paths: true

# What gives --strict its teeth. Without `anchors: warn` a link to a heading
# that does not exist resolves to nothing and mkdocs says not one word -- which
# matters here more than usual, because the generated CLI pages are what
# narrative pages deep-link into, and their anchors move when SatL renames a
# subcommand.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

not_in_nav: |
  snippets/*

